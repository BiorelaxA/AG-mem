protocol: adjacent_parent_child_directory_v1
model_path: /share/home/wtma/model/qwen3.5-27b
output_root: runs/parent_child_directories/qwen27b_adjacent_qwen4b_v1
workers: 128
retry_fallback: true
datasets:
  - name: locomo
    format: locomo_parquet
    input_root: data/processed/locomo_query9010_seed42_20261102
    splits: [train, validation, test]
    modality_policy: existing_captions
  - name: split_longmemeval_s
    format: longmemeval_parquet
    input_root: data/processed/query_dedup_val10_seed42_20261018
    splits: [train, validation, test]
    modality_policy: existing_captions
embedding:
  model_id: Qwen/Qwen3-Embedding-4B
  model_path: ../model/qwen3-embedding-4b
  model: agmem-embedding
  instruction: >-
    Represent the conversation message for grouping consecutive messages about
    the same local topic, event, or information need. Preserve the user's
    personal facts, constraints, corrections, and follow-up intent.
  max_input_tokens: 4096
  token_margin: 8
  batch_size: 32
  max_batch_tokens: 16384
  workers: 4
  expected_dimensions: 2560
  timeout_seconds: 120
  network_retries: 3
  api_key_env: AGMEM_API_KEY
segmentation:
  # Starting heuristics, not empirically calibrated topic probabilities.
  high_threshold: 0.78
  low_threshold: 0.55
  min_cohesion: 0.40
  max_segment_tokens: 4096
  context_weight: 0.15
  context_chars: 256
  review_enabled: true
  max_review_calls_per_session: 32
writer:
  context_tokens: 65536
  output_tokens: 4096
  max_output_tokens: 16384
  safety_margin: 128
  title_tokens: 24
  parent_content_tokens: 200
  child_content_tokens: 300
  max_entities: 12
  semantic_retries: 2
  context_blocks: 2
  fallback_blocks: 8
  output_language: en
service:
  model: agmem-27b
  api_key_env: AGMEM_API_KEY
  timeout_seconds: 600
  network_retries: 3
  seed: 42
  structured_outputs: true
